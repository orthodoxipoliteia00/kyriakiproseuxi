<br><center><h2 style="font-family:Verdana;">ΚΥΡΙΑΚΗ ΠΡΟΣΕΥΧΗ<BR>(ΠΑΤΕΡ ΗΜΩΝ)</h2><br>
<object class='h3'  style='font-size:22px; color:#2F4F4F; font-weight:normal; line-height:100%; font-family:  Georgia; text-decoration: none;'>Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς·<br><br>
ἁγιασθήτω τὸ ὄνομά σου·
<br><br>
ἐλθέτω ἡ βασιλεία σου·<br><br>
γενηθήτω τὸ θέλημά σου,<BR><BR>
ὡς ἐν οὐρανῷ, καὶ ἐπὶ τῆς γῆς·<br><br>
τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·<br><br>
καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν,<BR><BR>
ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν·<br><br>
καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν,<BR><BR>
ἀλλὰ ρῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ.<br><Br>
ὅτι σοῦ ἐστιν ἡ βασιλεία καὶ ἡ δύναμις καὶ ἡ δόξα<BR><BR>
εἰς τοὺς αἰῶνας· ἀμήν<br><Br></object>

</object>
</object>
